[project]
name = "limit-orderbook-workstation"
version = "0.1.0"
description = "Local public-market-data and market microstructure workstation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "websockets==17.4",
    "pyarrow==26.0.0",
    "duckdb==2.0.0",
    "streamlit==1.66.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "requests==2.34.2",
    "plotly==7.1.0",
    "websocket-client==1.9.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not network'"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: opt-in tests requiring live external services (excluded by default)",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["src/workstation"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
